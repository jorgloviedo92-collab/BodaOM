        // --- CÁLCULO DE EDAD EN AÑOS Y MESES ---
        function calculateAge(birthDateStr) {
            if (!birthDateStr) return { years: 0, months: 0, formatted: 'No registrada' };
            
            const birthDate = new Date(birthDateStr);
            const today = new Date();
            
            if (isNaN(birthDate.getTime())) return { years: 0, months: 0, formatted: 'Fecha inválida' };

            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            
            if (months < 0 || (months === 0 && today.getDate() < birthDate.getDate())) {
                years--;
                months += 12;
            }
            
            if (today.getDate() < birthDate.getDate() && months > 0) {
                months--;
            }

            let formatted = '';
            if (years > 0 && months > 0) {
                formatted = `${years} ${years === 1 ? 'año' : 'años'} y ${months} ${months === 1 ? 'mes' : 'meses'}`;
            } else if (years > 0) {
                formatted = `${years} ${years === 1 ? 'año' : 'años'}`;
            } else {
                formatted = `${months} ${months === 1 ? 'mes' : 'meses'}`;
            }

            return { years, months, formatted };
        }

                localStorage.setItem('ial_adults_v1', JSON.stringify(adults));
            }, [adults]);

            useEffect(() => {
                localStorage.setItem('ial_children_v1', JSON.stringify(children));
            }, [children]);

                setToast({ show: true, message: msg, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 3000);
            };

                return adults.find(a => a.id === selectedAdultId) || adults[0] || null;
            }, [adults, selectedAdultId]);

            const linkedSpouse = useMemo(() => {
                if (!selectedAdult || selectedAdult.maritalStatus !== 'Casado/a' || !selectedAdult.spouseId) return null;
                return adults.find(a => a.id === selectedAdult.spouseId) || null;
            }, [adults, selectedAdult]);

            const linkedChildren = useMemo(() => {
                if (!selectedAdult) return [];
                return children.filter(c => c.parentId1 === selectedAdult.id || c.parentId2 === selectedAdult.id);
            }, [children, selectedAdult]);

            const filteredAdults = useMemo(() => {
                return adults.filter(a => {
                    const q = searchQuery.toLowerCase().trim();
                    const matchesQuery = !q || 
                        a.names.toLowerCase().includes(q) || 
                        a.surnames.toLowerCase().includes(q) || 
                        a.cedula.toLowerCase().includes(q) || 
                        a.email.toLowerCase().includes(q);

                    const matchesCategory = !filterCategory || a.category === filterCategory;
                    const matchesMarital = !filterMaritalStatus || a.maritalStatus === filterMaritalStatus;
                    const matchesGender = !filterGender || a.gender === filterGender;

                    return matchesQuery && matchesCategory && matchesMarital && matchesGender;
                });
            }, [adults, searchQuery, filterCategory, filterMaritalStatus, filterGender]);

            const filteredChildren = useMemo(() => {
                return children.filter(c => {
                    const q = searchQuery.toLowerCase().trim();
                    const p1 = adults.find(a => a.id === c.parentId1);
                    const p2 = adults.find(a => a.id === c.parentId2);

                    const matchesQuery = !q || 
                        c.names.toLowerCase().includes(q) || 
                        c.surnames.toLowerCase().includes(q) ||
                        (p1 && (`${p1.names} ${p1.surnames}`).toLowerCase().includes(q)) ||
                        (p2 && (`${p2.names} ${p2.surnames}`).toLowerCase().includes(q));

                    const matchesGender = !filterGender || c.gender === filterGender;

                    return matchesQuery && matchesGender;
                });
            }, [children, adults, searchQuery, filterGender]);

            const handleSaveAdult = (formData) => {
                const isEditing = Boolean(formData.id);
                const memberId = isEditing ? formData.id : 'm_' + Date.now();
                const updatedData = { ...formData, id: memberId };

                setAdults(prevAdults => {
                    let nextList = [...prevAdults];
                    const existingIndex = nextList.findIndex(a => a.id === memberId);

                    const oldMember = existingIndex !== -1 ? nextList[existingIndex] : null;
                    const oldSpouseId = oldMember ? oldMember.spouseId : null;

                    if (existingIndex !== -1) {
                        nextList[existingIndex] = updatedData;
                    } else {
                        nextList.push(updatedData);
                    }

                    const newSpouseId = updatedData.maritalStatus === 'Casado/a' ? updatedData.spouseId : null;

                    if (oldSpouseId && oldSpouseId !== newSpouseId) {
                        const oldSpouseIdx = nextList.findIndex(a => a.id === oldSpouseId);
                        if (oldSpouseIdx !== -1) {
                            nextList[oldSpouseIdx] = {
                                ...nextList[oldSpouseIdx],
                                spouseId: null,
                                maritalStatus: nextList[oldSpouseIdx].maritalStatus === 'Casado/a' ? 'Soltero/a' : nextList[oldSpouseIdx].maritalStatus

                        }
                    }

                    if (newSpouseId) {
                        const newSpouseIdx = nextList.findIndex(a => a.id === newSpouseId);
                        if (newSpouseIdx !== -1) {
                            nextList[newSpouseIdx] = {
                                ...nextList[newSpouseIdx],
                                spouseId: memberId,
                                maritalStatus: 'Casado/a'
                            };
                        }
                    }

                    return nextList;
                });

                setSelectedAdultId(memberId);
                setShowAdultModal(false);
                triggerToast(isEditing ? '¡Datos del miembro actualizados!' : '¡Nuevo miembro registrado exitosamente!');
            };

            const handleSaveChild = (formData) => {
                const isEditing = Boolean(formData.id);
                const childId = isEditing ? formData.id : 'c_' + Date.now();
                const updatedData = { ...formData, id: childId };

                setChildren(prev => {
                    const idx = prev.findIndex(c => c.id === childId);
                    if (idx !== -1) {
                        const copy = [...prev];
                        copy[idx] = updatedData;
                        return copy;
                    }
                    return [...prev, updatedData];
                });

                setShowChildModal(false);
                triggerToast(isEditing ? '¡Datos del niño actualizados!' : '¡Niño registrado correctamente!');

                            </div>

                            <div className="pt-4 border-t border-slate-100 flex items-center justify-end gap-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition">
                                    Cancelar
                                </button>
                                <button type="submit" className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl text-xs font-bold shadow-md shadow-amber-500/20 transition active:scale-95">
                                    {editingChild ? 'Guardar Cambios' : 'Registrar Niño'}
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            );
        }

        // --- SUBCOMPONENTE: MODAL DE CONFIRMACIÓN EN ESPAÑOL ---
        function ConfirmationModal({ title, message, onConfirm, onCancel }) {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl p-6 shadow-2xl max-w-md w-full border border-slate-100 space-y-4">
                        <div className="flex items-center gap-3 text-rose-600">
                            <div className="p-3 bg-rose-100 rounded-2xl">
                                <i className="fa-solid fa-triangle-exclamation text-xl"></i>
                            </div>
                            <div>
                                <h3 className="text-base font-bold text-slate-900">{title}</h3>
                                <p className="text-xs text-slate-500">{message}</p>
                            </div>
                        </div>

                        <div className="pt-2 flex items-center justify-end gap-2">
                            <button onClick={onCancel} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition">
                                Cancelar
                            </button>
                            <button onClick={onConfirm} className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-xs font-semibold shadow-md shadow-rose-600/20 transition">
                                Eliminar
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
